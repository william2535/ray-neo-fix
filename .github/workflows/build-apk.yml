name: Build RayNeo APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract RayNeo project
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "RayNeo*.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "No RayNeo ZIP found in repository root"
            ls -la
            exit 1
          fi

          echo "Using $ZIP"
          mkdir -p unpacked
          unzip -q "$ZIP" -d unpacked

          SETTINGS=$(find unpacked -name settings.gradle -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle not found after extracting ZIP"
            find unpacked -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Build APK
        shell: bash
        run: |
          gradle -p "$PROJECT_DIR" :app:assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p output
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
            output/RayNeo-Head-Tracker-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RayNeo-Head-Tracker-APK
          path: output/RayNeo-Head-Tracker-debug.apk
